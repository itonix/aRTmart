<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ art.title }} - ArtMart</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>ArtMart</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/upload">Upload Art</a>
      <a href="/cart">Cart</a>
    </nav>
  </header>

  <main>
    <div class="art-detail">
      <img src="{{ art.thumbnail_url }}" alt=" {{ art.title }}">
      <h2>{{ art.title }}</h2>
      <p>By: {{ art.artist_name }}</p>
      <p>{{ art.description }}</p>
      <p>Price: {{ art.price }}</p>
      <form action="/buy/{{ art.id }}" method="POST">
        <button type="submit" class="btn">Buy Now</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 ArtMart</p>
  </footer>
</body>
</html>
